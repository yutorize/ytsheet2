    <article>
      <h1>魔法・神格・流派・特殊能力一覧</h1>
      <a class="search-button" onclick="toggleHide('form-search')"></a>
      <form method="get" action="./" name="search" id="form-search" class="hide">
        <h3>検索条件</h3>
        <input type="hidden" name="type" value="a">
        <TMPL_IF LOGIN_ID><label class="mylist"><input type="checkbox" name="mode" value="mylist" <TMPL_IF modeMylist>checked</TMPL_IF>>マイリスト内を検索</label></TMPL_IF>
        <dl>
          <dt>タグ
            <dd><input type="text" name="tag" value="<TMPL_VAR tag>">
          <dt>名称
            <dd><input type="text" name="name" value="<TMPL_VAR name>">
          <dt>大分類
            <dd><select name="category"><option value="all">すべて<TMPL_LOOP Categories><option value="<TMPL_VAR ID>" <TMPL_VAR SELECTED>><TMPL_VAR NAME></TMPL_LOOP></select><br>
          <dt>小分類
            <dd><input type="text" name="sub" value="<TMPL_VAR sub>">
        </dl>
        <p class="right"><input type="submit" value="検索"></p>
      </form>
      <script src="<TMPL_VAR coreDir>/skin/_common/js/list.js?<TMPL_VAR ver>" defer></script>
      <TMPL_IF searchSummary><dl class="search-summary"><dt>検索結果<dd><TMPL_VAR searchSummary></dl></TMPL_IF>
      <TMPL_LOOP Lists>
      <section class="list arts">
        <h2><TMPL_VAR NAME> <small><TMPL_VAR TEXT> (<TMPL_VAR NUM>)</small></h2>
        <TMPL_VAR PAGER>
        <table>
          <thead>
          <tr>
            <th class="name"><span>名称</span>
            <th class="author"><a href="./?type=a&category=<TMPL_VAR URL><TMPL_VAR qLinks>&sort=author">製作者</a>
            <th class="category"><span>大分類</span>
            <th class="sub"><span>小分類</span>
            <th class="summary"><span>概要</span>
            <th class="date"><a href="./?type=a&category=<TMPL_VAR URL><TMPL_VAR qLinks>&sort=date">更新日時</a>
          
          </thead>
          <TMPL_LOOP Lines><tr<TMPL_IF HIDE> class="hide"</TMPL_IF>>
            <td class="name"><a href="./?id=<TMPL_VAR ID>"><TMPL_VAR NAME></a>
            <td class="author"><TMPL_VAR AUTHOR>
            <td class="category"><TMPL_VAR CATEGORY>
            <td class="sub"><TMPL_VAR SUB>
            <td class="summary"><TMPL_VAR SUMMARY>
            <td class="tags"><TMPL_VAR TAGS></td>
            <td class="date"><div><TMPL_VAR DATE></div>
          </TMPL_LOOP>
        </table>
        <TMPL_VAR PAGER>
        <TMPL_IF MORE><p class="more"><a href="./?type=a&category=<TMPL_VAR URL><TMPL_VAR qLinks>">>>MORE</a></p></TMPL_IF>
      </section>
      </TMPL_LOOP>
      <TMPL_IF ListGroups><section class="list">
        <ul class="grouplist">
        <TMPL_LOOP ListGroups><li><a href="./?type=a&category=<TMPL_VAR ID>"><TMPL_VAR NAME><small><TMPL_VAR TEXT></small></a></TMPL_LOOP>
        </ul>
      </section></TMPL_IF>
    </article>
    <div id="page-top-button"><a href="#"></a></div>
