    <article>
      <h1>
        国一覧
        <TMPL_IF searchSummary><small><TMPL_VAR searchSummary></small></TMPL_IF>
      </h1>
      <form method="get" action="./" name="search" id="form-search">
        <h3 onclick="formSwitch()">検索フォーム▼</h3>
        <input type="hidden" name="type" value="c">
        <p id="form-search-area" style="display:none">
          グループ：<select name="group"><option value="all">すべて<TMPL_LOOP Groups><option value="<TMPL_VAR ID>" <TMPL_VAR SELECTED>><TMPL_VAR NAME></TMPL_LOOP></select><br>
          国名　　：<input type="text" name="name" value="<TMPL_VAR name>"><br>
          ＰＬ名　：<input type="text" name="player" value="<TMPL_VAR player>"><br>
          タグ　　：<input type="text" name="tag" value="<TMPL_VAR tag>"><br>
          <TMPL_IF LOGIN_ID>マイリスト内検索：<input type="checkbox" name="mode" value="mylist" <TMPL_IF modeMylist>checked</TMPL_IF>></TMPL_IF><br>
          <input type="submit" value="検索">
        </p>
      </form>
      <script src="<TMPL_VAR coreDir>/skin/_common/js/list.js" defer></script>
      <TMPL_LOOP Lists>
      <section class="list country" id="group-<TMPL_VAR ID>">
        <h2><TMPL_VAR NAME> <small><TMPL_VAR TEXT> (<TMPL_VAR NUM>)</small></h2>
        <TMPL_VAR PAGER>
        <TMPL_IF simpleList>
        <ul>
          <TMPL_LOOP Lines><li<TMPL_IF HIDE> class="hide"</TMPL_IF>>
            <a href="./?id=<TMPL_VAR ID>" data-lv="<TMPL_VAR LV>"><TMPL_VAR NAME><small><TMPL_VAR PLAYER></small></a>
          </TMPL_LOOP>
        </ul>
        <TMPL_ELSE>
        <table>
          <thead>
            <tr>
              <th class="name"><a href="./?type=c&group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=name">国名</a>
              <th class="player"><a href="./?type=c&group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=pl">プレイヤー</a>
              <th class="lord"><span>ロード</span>
              <th class="lv"><a href="./?type=c&group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=lv">レベル</a>
              <th class="peerage"><span>爵位</span>
              <th class="date"><a href="./?type=c&group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=date">更新<br>日時</a>
          </thead>
          <TMPL_LOOP Lines><tr<TMPL_IF HIDE> class="hide"</TMPL_IF>>
            <td class="name"><a href="./?id=<TMPL_VAR ID>"><TMPL_VAR NAME></a>
            <td class="player"><TMPL_VAR PLAYER>
            <td class="lord"><TMPL_VAR LORD>
            <td class="lv"><TMPL_VAR LV>
            <td class="peerage"><TMPL_VAR PEERAGE>
            <td class="tags"><TMPL_VAR TAGS></td>
            <td class="date"><div><TMPL_VAR DATE></div>
          </TMPL_LOOP>
        </table>
        </TMPL_IF>
        <TMPL_VAR PAGER>
        <TMPL_IF MORE><p class="more"><a href="./?type=c&group=<TMPL_VAR ID>">>>MORE</a></p></TMPL_IF>
      </section>
      </TMPL_LOOP>
      <TMPL_IF simpleIndex><section class="list">
        <ul class="grouplist">
        <TMPL_LOOP Groups><li><a href="./?type=c&group=<TMPL_VAR ID>"><TMPL_VAR NAME><small><TMPL_VAR TEXT></small></a></TMPL_LOOP>
        </ul>
      </section></TMPL_IF>
    </article>
    <div id="page-top-button"><a href="#"></a></div>
