    <article>
      <h1>エネミー一覧</h1>
      <a class="search-button" onclick="toggleHide('form-search')"></a>
      <form method="get" action="./" name="search" id="form-search" class="hide">
        <h3>検索条件</h3>
        <input type="hidden" name="type" value="e">
        <TMPL_IF LOGIN_ID><label class="mylist"><input type="checkbox" name="mode" value="mylist" <TMPL_IF modeMylist>checked</TMPL_IF>>マイリスト内を検索</label></TMPL_IF>
        <dl>
          <dt>タグ
            <dd><input type="text" name="tag" value="<TMPL_VAR tag>">
          <dt>グループ
            <dd><select name="group"><option value="all">すべて<TMPL_LOOP Groups><option value="<TMPL_VAR ID>" <TMPL_VAR SELECTED>><TMPL_VAR NAME></TMPL_LOOP></select>
          <dt>名称
            <dd><input type="text" name="name" value="<TMPL_VAR name>">
          <dt>データ製作者
            <dd><input type="text" name="author" value="<TMPL_VAR author>">
          <dt>分類
            <dd><input type="text" name="taxon" value="<TMPL_VAR taxon>">
          <dt>属性
            <dd><input type="text" name="element" value="<TMPL_VAR element>" placeholder="AND検索有効">
          <dt>レベル
            <dd><input type="number" name="lv-min" value="<TMPL_VAR lvMin>" style="width:6em;"> ～ <input type="number" name="lv-max" value="<TMPL_VAR lvMax>" style="width:6em;">
          <dt>モブ
            <dd><label><input type="checkbox" name="mob" value="1" <TMPL_IF mob>checked</TMPL_IF>></dd></label>
        </dl>
        <p class="right"><input type="submit" value="検索"></p>
      </form>
      <script src="<TMPL_VAR coreDir>/skin/_common/js/list.js?<TMPL_VAR ver>" defer></script>
      <TMPL_IF searchSummary><dl class="search-summary"><dt>検索結果<dd><TMPL_VAR searchSummary></dl></TMPL_IF>
      <TMPL_INCLUDE NAME="../_common/list-empty.html">
      <TMPL_LOOP Lists>
      <section class="list enemy" id="group-<TMPL_VAR ID>">
        <h2><TMPL_VAR NAME> <small><TMPL_VAR TEXT> (<TMPL_VAR NUM>)</small></h2>
        <TMPL_VAR PAGER>
        <TMPL_IF simpleList>
        <ul>
          <TMPL_LOOP Lines><li<TMPL_IF HIDE> class="hide"</TMPL_IF>>
            <a href="./?id=<TMPL_VAR ID>" data-lv="<TMPL_VAR LV>"><TMPL_VAR NAME><small><TMPL_VAR PLAYER></small></a>
          </TMPL_LOOP>
        </ul>
        <TMPL_ELSE>
        <table>
          <thead>
            <tr>
              <th class="name"><a href="./?type=e&group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=name">名称</a>
              <th class="author"><a href="./?type=e&group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=author">データ製作者</a>
              <th class="taxon"><span>分類</span>
              <th class="element"><span>属性</span>
              <th class="lv"><a href="./?type=e&group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=lv">レベル</a>
              <th class="type"><span>種別</span>
              <th class="date"><a href="./?type=e&group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=date">更新<br>日時</a>
          </thead>
          <TMPL_LOOP Lines><tr<TMPL_IF HIDE> class="hide"</TMPL_IF>>
            <td class="name"><a href="./?id=<TMPL_VAR ID>"><TMPL_VAR NAME></a>
            <td class="author"><TMPL_VAR PLAYER>
            <td class="taxon"><TMPL_VAR TAXON>
            <td class="element"><TMPL_VAR ELEMENT>
            <td class="lv"><TMPL_VAR LV>
            <td class="type"><TMPL_VAR TYPE>
            <td class="tags"><TMPL_VAR TAGS></td>
            <td class="date"><div><TMPL_VAR DATE></div>
          </TMPL_LOOP>
        </table>
        </TMPL_IF>
        <TMPL_VAR PAGER>
        <TMPL_IF MORE><p class="more"><a href="./?type=e&group=<TMPL_VAR ID>">>>MORE</a></p></TMPL_IF>
      </section>
      </TMPL_LOOP>
      <TMPL_IF simpleIndex><section class="list">
        <ul class="grouplist">
        <TMPL_LOOP Groups><li><a href="./?type=e&group=<TMPL_VAR ID>"><TMPL_VAR NAME><small><TMPL_VAR TEXT></small></a></TMPL_LOOP>
        </ul>
      </section></TMPL_IF>
    </article>
    <div id="page-top-button"><a href="#"></a></div>
